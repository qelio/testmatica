      TEST_DATABASE_URL: postgresql+asyncpg://marketplace:marketplace_dev@postgres:5432/marketplace_test
      IDENTITY_URL: http://identity:8000
      CONTENT_URL: http://content:8000
    volumes:
      - ./services/marketplace:/app
      - *libs-volume
    depends_on: *python-depends
    labels:
      - traefik.enable=true
      - traefik.http.routers.marketplace.rule=PathPrefix(`/api/marketplace`) && !PathPrefix(`/api/marketplace/internal`)
      - traefik.http.routers.marketplace.middlewares=marketplace-strip,api-ratelimit@docker
