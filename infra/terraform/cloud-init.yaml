#cloud-config
# Первичная настройка ВМ: пользователь для выкладки, Docker, файрвол ОС не нужен (группы безопасности облака).
users:
  - name: ${user}
    groups: [sudo, docker]
    shell: /bin/bash
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    ssh_authorized_keys:
      - ${ssh_key}

package_update: true
package_upgrade: true
packages:
  - docker.io
  - docker-compose-v2
  - unattended-upgrades

write_files:
  # Логи Docker не разрастаются.
  - path: /etc/docker/daemon.json
    content: |
      {"log-driver": "json-file", "log-opts": {"max-size": "10m", "max-file": "5"}}

runcmd:
  # Подкачка 2 ГБ: запас памяти на пиках (запись занятия запускает Chrome).
  - fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile
  - echo '/swapfile none swap sw 0 0' >> /etc/fstab
  - systemctl enable --now docker
  - usermod -aG docker ${user}
  - mkdir -p /opt/testmatica
  - chown ${user}:${user} /opt/testmatica
