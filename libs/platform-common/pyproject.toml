[project]
name = "testmatica-common"
version = "0.1.0"
description = "Общий код сервисов Тестматики: конфиг, логи, БД, JWT, outbox/inbox, RabbitMQ"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "aio-pika>=9.5",
    "pyjwt[crypto]>=2.10",
    "httpx>=0.28",
    "pydantic-settings>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/testmatica_common"]
