    environment:
      <<: *python-env
      ROOT_PATH: /api/content
      DATABASE_URL: postgresql+asyncpg://content:content_dev@postgres:5432/content
      TEST_DATABASE_URL: postgresql+asyncpg://content:content_dev@postgres:5432/content_test
      CLASSROOM_URL: http://classroom:8000
    volumes:
      - ./services/content:/app
      - *libs-volume
    depends_on: *python-depends
    labels:
      - traefik.enable=true
      - traefik.http.routers.content.rule=PathPrefix(`/api/content`) && !PathPrefix(`/api/content/internal`)
      - traefik.http.routers.content.middlewares=content-strip,api-ratelimit@docker
      - traefik.http.middlewares.content-strip.stripprefix.prefixes=/api/content
