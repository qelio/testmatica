# Сборка образов и выкладка на сервер при пуше в main (решение №28).
# Pull Request в main — те же проверки и сборка, но без загрузки образов и без выкладки (решение №30).
# Образы — в GitHub Container Registry, ghcr.io/<репозиторий>/<сервис> (решение №45): вход — встроенным GITHUB_TOKEN,
# отдельных ключей реестра нет. Секреты репозитория: SSH_PRIVATE_KEY, SSH_HOST, SSH_USER.
name: Сборка и выкладка

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# Выкладки в main идут строго по очереди; проверки PR — своя очередь на каждую ветку,
# новый пуш в ветку отменяет устаревшую проверку.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.head_ref) || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/${{ github.repository }}

jobs:
  check:
    name: Проверка веба
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      # PageProps / LayoutProps генерирует Next (next typegen) — на чистой машине их ещё нет.
      - run: npx next typegen && npx tsc --noEmit && npm run lint
        working-directory: web

  images:
    name: Образ ${{ matrix.name }}
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: identity, context: ., file: infra/docker/python-service.Dockerfile }
          - { name: mcp, context: ., file: infra/docker/python-service.Dockerfile }
          - { name: notification, context: ., file: infra/docker/python-service.Dockerfile }
          - { name: audit, context: ., file: infra/docker/python-service.Dockerfile }
          - { name: classroom, context: ., file: infra/docker/python-service.Dockerfile }
          - { name: schedule, context: ., file: infra/docker/python-service.Dockerfile }
          - { name: academic, context: ., file: infra/docker/python-service.Dockerfile }
          - { name: chat, context: ., file: infra/docker/python-service.Dockerfile }
          - { name: whiteboard, context: ., file: infra/docker/python-service.Dockerfile }
          - { name: media, context: ., file: infra/docker/python-service.Dockerfile }
          - { name: content, context: ., file: infra/docker/python-service.Dockerfile }
          - { name: moderation, context: ., file: infra/docker/python-service.Dockerfile }
          - { name: assessment, context: ., file: infra/docker/python-service.Dockerfile }
          - { name: marketplace, context: ., file: infra/docker/python-service.Dockerfile }
          - { name: billing, context: ., file: infra/docker/python-service.Dockerfile }
          - { name: video, context: ., file: infra/docker/python-service.Dockerfile }
          - { name: code-runner, context: services/code-runner, file: services/code-runner/Dockerfile }
          - { name: web, context: web, file: web/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Вход в GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: SERVICE=${{ matrix.name }}
          # PR — только проверяем, что образ собирается; в реестр — из main.
          push: ${{ github.event_name != 'pull_request' }}
          # Без аттестаций сборки — в списке пакетов не появляются лишние «unknown/unknown» манифесты.
          provenance: false
          sbom: false
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.name }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    name: Выкладка
    needs: images
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: SSH-ключ
        env:
          KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          # Сеть GitHub рвёт соединения, молчащие несколько минут (скачивание образов) — держим его живым.
          printf 'Host *\n  ServerAliveInterval 30\n  ServerAliveCountMax 6\n' > ~/.ssh/config
      - name: Файлы и перезапуск
        env:
          TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
          # Сервер скачивает образы этим же временным токеном (через stdin) — пока идёт выкладка.
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scp compose.prod.yaml infra/prod/deploy.sh infra/prod/postgres-init.sh infra/prod/postgres-backup.sh "$TARGET:/opt/testmatica/"
          printf '%s' "$TOKEN" | ssh "$TARGET" "sh /opt/testmatica/deploy.sh ${{ github.sha }} ${{ github.actor }}"
