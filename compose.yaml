      - traefik.http.routers.schedule.middlewares=schedule-strip,api-ratelimit@docker
      - traefik.http.middlewares.schedule-strip.stripprefix.prefixes=/api/schedule
      - traefik.http.services.schedule.loadbalancer.server.port=8000

  academic:
    build:
      context: .
      dockerfile: infra/docker/python-service.Dockerfile
      args: { SERVICE: academic, DEV: "1" }
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
