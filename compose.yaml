      <<: *python-env
      ROOT_PATH: /api/media
      DATABASE_URL: postgresql+asyncpg://media:media_dev@postgres:5432/media
      TEST_DATABASE_URL: postgresql+asyncpg://media:media_dev@postgres:5432/media_test
      S3_ENDPOINT: http://s3:8333
      S3_PUBLIC_ENDPOINT: http://localhost:8333
      S3_BUCKET: testmatica
    volumes:
      - ./services/media:/app
      - *libs-volume
    depends_on:
      <<: *python-depends
      s3:
        condition: service_started
    labels:
      - traefik.enable=true
      - traefik.http.routers.media.rule=PathPrefix(`/api/media`) && !PathPrefix(`/api/media/internal`)
      - traefik.http.routers.media.middlewares=media-strip,media-body,api-ratelimit@docker
      - traefik.http.middlewares.media-strip.stripprefix.prefixes=/api/media
      # Учебные видео — до 500 МБ.
      - traefik.http.middlewares.media-body.buffering.maxRequestBodyBytes=524288000
      - traefik.http.services.media.loadbalancer.server.port=8000

  content:
