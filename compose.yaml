      args: { SERVICE: assessment, DEV: "1" }
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
             --reload-dir /app/app --reload-dir /libs/platform-common/src
             --proxy-headers --forwarded-allow-ips='*'"
    environment:
      <<: *python-env
      ROOT_PATH: /api/assessment
      DATABASE_URL: postgresql+asyncpg://assessment:assessment_dev@postgres:5432/assessment
      TEST_DATABASE_URL: postgresql+asyncpg://assessment:assessment_dev@postgres:5432/assessment_test
      CODE_RUNNER_URL: http://code-runner:8000
    volumes:
      - ./services/assessment:/app
      - *libs-volume
    # Единственный сервис, которому видна песочница.
    networks: [default, sandbox]
    depends_on:
      <<: *python-depends
      code-runner:
        condition: service_started
    labels:
      - traefik.enable=true
      - traefik.docker.network=testmatica_default
      - traefik.http.routers.assessment.rule=PathPrefix(`/api/assessment`) && !PathPrefix(`/api/assessment/internal`)
      - traefik.http.routers.assessment.middlewares=assessment-strip,api-ratelimit@docker
      - traefik.http.middlewares.assessment-strip.stripprefix.prefixes=/api/assessment
      - traefik.http.services.assessment.loadbalancer.server.port=8000

  marketplace:
    build:
      context: .
      dockerfile: infra/docker/python-service.Dockerfile
      args: { SERVICE: marketplace, DEV: "1" }
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
